# DocuMind - Production Nginx Reverse Proxy Configuration
# Domain: documind.niranjansah87.com.np
# ---------------------------------------------------------------------------
# Architecture:
#   Frontend (Next.js)      -> 127.0.0.1:3000
#   Backend API (FastAPI)   -> 127.0.0.1:8000 (hidden, no public backend domain)
#
# All browser traffic hits documind.niranjansah87.com.np.
# Requests to /api/*, /health, /ready are internally proxied to FastAPI.
# Requests to / and /_next/* are proxied to Next.js.
# ---------------------------------------------------------------------------

upstream documind_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream documind_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

# --- HTTP -> HTTPS redirect for documind.niranjansah87.com.np -----------------
server {
    listen 80;
    listen [::]:80;
    server_name documind.niranjansah87.com.np;

    # Allow Let's Encrypt HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: documind.niranjansah87.com.np ------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name documind.niranjansah87.com.np;

    # SSL Certificates (managed by certbot)
    ssl_certificate     /etc/letsencrypt/live/documind.niranjansah87.com.np/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/documind.niranjansah87.com.np/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    # Maximum file upload size (matches / exceeds max_upload_bytes)
    client_max_body_size 25m;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip settings
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml font/woff2;

    # 1. Next.js static asset caching
    location /_next/static/ {
        proxy_pass http://documind_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 2. Next.js public images and icons
    location ~* \.(?:ico|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
        proxy_pass http://documind_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=86400";
    }

    # 3. FastAPI Health and Readiness Endpoints
    location ~ ^/(health|ready)$ {
        proxy_pass http://documind_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        access_log off;
    }

    # 4. FastAPI REST and SSE Streaming API Surface
    # Proxied internally - backend is NEVER exposed to the public internet
    location /api/ {
        proxy_pass http://documind_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # CRITICAL for SSE Streaming (/api/v1/chat)
        # Prevents Nginx from buffering event-stream chunks
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Keep streaming alive during LLM generation and retrieval
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
    }

    # 5. Next.js App Router (Frontend)
    location / {
        proxy_pass http://documind_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}

