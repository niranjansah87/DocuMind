# DocuMind - HTTP Bootstrap Nginx Configuration
# Used for initial Let's Encrypt / Certbot ACME HTTP-01 challenge
# Domain: documind.niranjansah87.com.np

server {
    listen 80;
    listen [::]:80;
    server_name documind.niranjansah87.com.np;

    # Allow Let's Encrypt challenge requests
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Temporary placeholder response during cert issuance
    location / {
        default_type text/plain;
        return 200 "DocuMind deployment bootstrap: obtaining TLS certificate for documind.niranjansah87.com.np...";
    }
}
